<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slopracer F1</title>
  <meta name="description" content="Play Slopracer F1, a retro Formula racer with PS1-inspired graphics, in your browser.">
  <link rel="canonical" href="https://slopracer-f1.pages.dev/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Slopracer F1">
  <meta property="og:title" content="Slopracer F1">
  <meta property="og:description" content="Play Slopracer F1, a retro Formula racer with PS1-inspired graphics, in your browser.">
  <meta property="og:url" content="https://slopracer-f1.pages.dev/">
  <meta property="og:image" content="https://slopracer-f1.pages.dev/social-preview-v2.png">
  <meta property="og:image:secure_url" content="https://slopracer-f1.pages.dev/social-preview-v2.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Slopracer F1: a purple Formula car racing through Neon Sakura at sunset.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Slopracer F1">
  <meta name="twitter:description" content="Play Slopracer F1, a retro Formula racer with PS1-inspired graphics, in your browser.">
  <meta name="twitter:image" content="https://slopracer-f1.pages.dev/social-preview-v2.png">
  <meta name="twitter:image:alt" content="Slopracer F1: a purple Formula car racing through Neon Sakura at sunset.">
  <link rel="icon" type="image/svg+xml" href="./pkg/icon.svg">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #power {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1.4em;
      font: 16px Menlo, "SF Mono", Monaco, Consolas, monospace;
      color: #c4c8d6; text-align: center; cursor: pointer; user-select: none;
    }
    #power h1 {
      margin: 0; font-size: clamp(1.5rem, 6vw, 3.2rem); letter-spacing: .12em; color: #ffc828;
      text-shadow: 4px 4px 0 #a0300a;
    }
    #power .hint { color: #66687a; line-height: 1.6; }
    .blink { animation: blink 1.1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
  </style>
</head>
<body>
  <canvas id="screen"></canvas>
  <div id="power">
    <h1>Slopracer F1</h1>
    <p id="status" class="blink">Loading cartridge…</p>
    <p class="hint">Arrows / WASD drive · Space shift gear · P pause · M mute<br>
      PlayStation, Xbox and other gamepads work too</p>
  </div>
  <script type="module">
    import init, { start } from "./pkg/slopracer_f1.js";

    const overlay = document.getElementById("power");
    const status = document.getElementById("status");
    try {
      await init();
    } catch (e) {
      status.classList.remove("blink");
      status.textContent = `Failed to load the game: ${e}`;
      throw e;
    }
    status.textContent = "Press any key or click to power on";

    // Starting from a user gesture lets the browser play the audio.
    const power = (e) => {
      if (e.type === "keydown" && (e.metaKey || e.ctrlKey || e.altKey || e.key === "Escape")) return;
      removeEventListener("keydown", power);
      removeEventListener("pointerdown", power);
      overlay.remove();
      start("screen");
    };
    addEventListener("keydown", power);
    addEventListener("pointerdown", power);
  </script>
</body>
</html>
